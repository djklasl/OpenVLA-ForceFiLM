# ============================================
# 观测空间相关配置 (Observation Related)
# ============================================

# 数据模态类型列表
# - "image": 图像观测数据（如RGB相机图像）
# - "proprio": 本体感知数据（如关节位置、夹爪状态等机器人自身状态）
data_modality:
  - "image"
  - "proprio"

# 序列长度
# 定义每个训练样本包含的时间步数量
# 值为10表示每次取连续10帧观测作为一个训练样本
seq_len: 10

# 帧堆叠数量
# 将连续多少帧图像堆叠在一起作为输入
# 值为1表示不堆叠，仅使用当前帧
frame_stack: 1

# 是否使用手眼相机（eye-in-hand camera）
# true: 使用安装在机械臂末端执行器上的相机图像
# false: 不使用手眼相机
use_eye_in_hand: true

# 是否使用夹爪状态
# true: 将夹爪的开合状态作为观测输入
# false: 不包含夹爪状态
use_gripper: true

# 是否使用关节状态
# true: 将机械臂各关节的位置/角度作为观测输入
# false: 不包含关节状态
use_joint: true

# 是否使用末端执行器（End Effector）状态
# true: 包含末端执行器的位置/姿态等信息
# false: 不包含末端执行器状态
use_ee: false

# ============================================
# 语言指令相关配置
# ============================================

# 任务描述语言的最大词长度
# 用于对自然语言指令进行tokenization时的最大长度限制
# 超过此长度的文本将被截断
max_word_len: 25

# ============================================
# 状态表示相关配置
# ============================================

# 状态维度
# null: 自动推断或使用默认值
# 可以指定为具体数值（如512）来限制状态向量的维度
state_dim: null

# 关键点（Key Point）数量
# 用于将图像表示为64个关键点特征
# 这是一种对图像进行特征提取和降维的方法
num_kp: 64

# 图像高度（像素）
# 输入图像将被调整/裁剪为128x128分辨率
img_h: 128

# 图像宽度（像素）
img_w: 128

# ============================================
# 任务采样相关配置
# ============================================

# 任务组大小
# 控制同时采样多少个任务的数据
# 值为1表示每次只从一个任务中采样
task_group_size: 1

# 任务顺序索引
# 用于指定从第几个任务开始（用于多任务学习场景）
# 值为0表示从第一个任务开始
task_order_index: 0

# 是否打乱任务顺序
# true: 随机打乱任务的采样顺序
# false: 按照固定顺序采样任务
shuffle_task: false

# ============================================
# 观测空间详细配置
# ============================================

# 观测模态的具体配置
obs:
    modality:
        # RGB图像通道列表
        # agentview_rgb: 第三人称视角（固定相机）的RGB图像
        # eye_in_hand_rgb: 手眼相机视角（安装在机械臂末端）的RGB图像
        rgb: ["agentview_rgb", "eye_in_hand_rgb"]

        # 深度图像通道列表（当前为空，不使用深度信息）
        depth: []

        # 低维状态数据列表
        # gripper_states: 夹爪状态（通常是1维，表示开合程度）
        # joint_states: 关节位置状态（通常是7维，对应7自由度机械臂）
        # left_finger_force: 左手指六维力/力矩（6维）
        # right_finger_force: 右手指六维力/力矩（6维）
        low_dim: ["gripper_states", "joint_states", "left_finger_force", "right_finger_force"]

# ============================================
# 观测键映射配置
# ============================================

# 将代码中的观测键名映射到robosuite环境中的实际观测键名
# 这样可以将通用的配置适配到具体的仿真环境
obs_key_mapping:
  # 第三人称视角图像 -> robosuite中的agentview_image
  agentview_rgb: agentview_image

  # 手眼相机图像 -> robosuite中的robot0_eye_in_hand_image
  eye_in_hand_rgb: robot0_eye_in_hand_image

  # 夹爪状态 -> robosuite中的robot0_gripper_qpos（位置）
  gripper_states: robot0_gripper_qpos

  # 关节状态 -> robosuite中的robot0_joint_pos（位置）
  joint_states: robot0_joint_pos

  # 左手指六维力 -> 环境观测中的 left_finger_force
  left_finger_force: left_finger_force

  # 右手指六维力 -> 环境观测中的 right_finger_force
  right_finger_force: right_finger_force

# ============================================
# 动作空间相关配置 (Action Related)
# ============================================

# 仿射变换平移参数
# 用于数据增强，对图像进行随机平移的像素范围
# 值为4表示平移范围是-4到+4像素
affine_translate: 4

# 动作缩放因子
# 用于对动作空间进行缩放
# 1.0表示不缩放，使用原始动作范围
# 可能需要根据具体任务调整（如0.1表示将动作范围缩小到原来的1/10）
action_scale: 1.0

# 训练集比例
# 将整个数据集按此比例划分为训练集和验证集
# 0.8表示80%用于训练，20%用于验证
train_dataset_ratio: 0.8
