# ============================================
# 模型加载路径配置
# ============================================

# 预训练模型加载路径
# 留空（""）表示从训练好的检查点加载模型
# 仅在独立评估预训练模型时使用，与训练流程分开
# 示例: "path/to/checkpoint.pth" 或 "path/to/model.pkl"
load_path: "" # only used when separately evaluating a pretrained model

# ============================================
# 评估模式开关
# ============================================

# 是否启用评估模式
# true: 运行评估流程，测试模型在测试集上的表现
# false: 运行训练流程
eval: true

# ============================================
# 数据加载配置
# ============================================

# 批次大小
# 每次评估时并行处理的数据样本数量
# 较大的值可以加快评估速度，但需要更多显存
# 64是常用的批次大小，可根据GPU显存调整
batch_size: 64

# 数据加载工作进程数
# 用于并行加载数据的子进程数量
# 4表示使用4个进程同时加载数据到内存
# 可根据CPU核心数调整，通常设置为4-8
num_workers: 4

# ============================================
# 评估轮次与频率配置
# ============================================

# 评估轮次数
# 每次评估时运行多少个测试 episode
# 20表示对每个任务测试20次，取平均结果
# 轮次越多结果越稳定，但评估时间越长
n_eval: 20

# 评估频率
# 每训练多少个 epoch 进行一次评估
# 5表示每训练5个epoch就进行一次模型评估
# 用于监控训练过程中模型性能的变化
eval_every: 5

# ============================================
# 仿真步数配置
# ============================================

# 单次评估最大步数
# 每个 episode 最多运行多少个时间步
# 600步对应约30秒（假设50Hz控制频率）
# 超过此步数无论任务是否完成都会终止
max_steps: 600

# ============================================
# 并行评估配置
# ============================================

# 是否使用多进程并行评估
# true: 同时运行多个仿真环境进行评估，大幅提升速度
# false: 串行运行评估，速度较慢
use_mp: true

# 并行进程数
# 同时启动多少个仿真环境进程进行并行评估
# 20表示同时运行20个独立的仿真实例
# 可根据CPU核心数和内存大小调整
num_procs: 20

# ============================================
# 仿真状态保存配置
# ============================================

# 是否保存仿真状态
# true: 保存每一步的仿真状态（图像、关节状态等），用于后续分析或可视化
# false: 不保存中间状态，仅保存最终评估结果
# 保存状态会占用大量磁盘空间，通常调试时才开启
save_sim_states: false
