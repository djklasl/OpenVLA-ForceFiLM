# ============================================
# AGEM 终身学习配置
# ============================================
# AGEM: Averaged Gradient Episodic Memory
# 通过约束梯度更新方向来减少灾难性遗忘

# 学习算法
# AGEM: 平均梯度情节记忆方法
#   - 保存少量旧任务样本作为记忆回放
#   - 约束当前任务梯度与旧任务梯度的夹角小于90度
#   - 确保新任务的学习不会损害旧任务性能
algo: AGEM

# 记忆回放缓冲区大小
# 1000: 每个任务保存1000个样本
# 较大的值可以更好地保留旧任务知识，但增加内存和计算开销
# 这些样本在训练新任务时用于计算参考梯度
n_memories: 1000
