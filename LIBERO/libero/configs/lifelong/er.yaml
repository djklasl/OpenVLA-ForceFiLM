# ============================================
# ER 终身学习配置
# ============================================
# ER: Experience Replay（经验回放）
# 通过混合新旧数据来减少灾难性遗忘

# 学习算法
# ER: 经验回放方法
#   - 保存少量旧任务样本作为记忆回放
#   - 训练新任务时，从记忆中随机采样旧数据一起训练
#   - 简单有效，是最基础的终身学习方法之一
algo: ER

# 记忆回放缓冲区大小
# 1000: 每个任务保存1000个样本
# 较大的值可以更好地保留旧任务知识，但增加内存和计算开销
# 这些样本会被随机采样并与当前任务数据混合训练
n_memories: 1000
