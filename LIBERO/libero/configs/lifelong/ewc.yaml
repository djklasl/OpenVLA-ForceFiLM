# ============================================
# EWC 终身学习配置
# ============================================
# EWC: Elastic Weight Consolidation（弹性权重巩固）
# 通过计算参数重要性来保护重要权重

# 学习算法
# EWC: 弹性权重巩固方法
#   - 在学习新任务前，计算每个参数的重要性（Fisher信息矩阵）
#   - 对重要参数施加约束，防止其被大幅修改
#   - 类似于大脑中"巩固"重要记忆的机制
algo: EWC

# EWC 正则化系数
# 50000: 控制 EWC 惩罚项的权重
# 较大的值更严格地保护旧任务知识，但可能限制新任务学习
# 需要根据具体任务调整此超参数
e_lambda: 50000

# Fisher 信息衰减系数
# 0.9: 每个任务结束后将 Fisher 信息矩阵乘以 0.9
# 用于处理多个任务场景，使旧任务的重要性逐渐衰减
# 值为 1 表示不衰减，值越小衰减越快
gamma: 0.9
