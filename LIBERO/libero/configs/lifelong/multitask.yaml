# ============================================
# 多任务学习配置
# ============================================
# Multitask: 多任务学习（Multi-Task Learning）
# 同时训练所有任务，数据混合在一起

# 学习算法
# Multitask: 多任务学习方法
#   - 所有任务的数据混合在一起训练
#   - 模型同时学习所有任务
#   - 作为终身学习的上界基准（最佳性能）
algo: Multitask

# 是否在训练时进行评估
# false: 只在训练结束后评估所有任务
# true: 在训练过程中定期评估所有任务
eval_in_train: false
