# ============================================
# PackNet 终身学习配置
# ============================================
# PackNet: Network Pruning for Continual Learning
# 通过网络剪枝为不同任务分配独立的参数子集

# 学习算法
# PackNet: 打包网络方法
#   - 学习每个任务后，剪除部分不重要的权重
#   - 剪除的权重被"冻结"，不再更新
#   - 剩余的"活跃"权重用于学习下一个任务
#   - 每个任务使用不同的子网络，互不干扰
algo: PackNet

# 剪枝比例
# 0.75: 每个任务完成后剪除75%的权重
# 剩余25%的权重用于学习下一个任务
# 较大的值可以学习更多任务，但每个任务的容量减少
# 值为 0.8 表示每个任务使用 20% 的网络
prune_perc: 0.75

# 剪枝后训练轮数
# 50: 在网络剪枝后继续训练50个epoch
# 用于恢复因剪枝造成的性能下降
# 确保在有限容量下达到最佳性能
post_prune_epochs: 50

# 剪枝后评估频率
# 5: 剪枝后每训练5个epoch评估一次
# 用于监控剪枝后的恢复过程
post_eval_every: 5
