# ============================================
# 批量颜色抖动增强配置
# ============================================
# BatchWiseImgColorJitterAug: 对整批图像应用相同的颜色抖动
# 确保同一批次内的图像使用相同的颜色变换，保持多视图之间的一致性

# 增强类型
# BatchWiseImgColorJitterAug: 批量级别的颜色抖动增强
network: BatchWiseImgColorJitterAug

# 增强参数配置
network_kwargs:
  # 输入形状
  # null: 自动推断输入图像的形状
  input_shape: null

  # 亮度调整范围
  # 0.3: 亮度在 [1-0.3, 1+0.3] = [0.7, 1.3] 倍之间随机变化
  # 值越大，亮度变化越剧烈
  brightness: 0.3

  # 对比度调整范围
  # 0.3: 对比度在 [0.7, 1.3] 倍之间随机变化
  # 值越大，对比度变化越剧烈
  contrast: 0.3

  # 饱和度调整范围
  # 0.3: 饱和度在 [0.7, 1.3] 倍之间随机变化
  # 值越大，颜色饱和度变化越剧烈
  saturation: 0.3

  # 色调调整范围
  # 0.3: 色调在 [-0.3, 0.3] 之间随机变化（弧度）
  # 值越大，颜色偏移越明显
  hue: 0.3

  # 增强概率（epsilon）
  # 0.1: 10% 的概率应用颜色抖动
  # 用于控制数据增强的强度
  epsilon: 0.1
