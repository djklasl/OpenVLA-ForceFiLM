# ============================================
# 恒等数据增强配置
# ============================================
# IdentityAug: 不进行任何数据增强（恒等映射）
# 用于禁用数据增强时的配置

# 增强类型
# IdentityAug: 恒等增强，直接返回原始数据
network: IdentityAug

# 增强参数配置
network_kwargs:
  # 输入形状
  # null: 自动推断输入数据的形状
  # 可手动指定输入数据的维度
  input_shape: null
