# ============================================
# 平移增强配置
# ============================================
# TranslationAug: 对图像进行随机平移
# 通过平移图像来增强模型对物体位置变化的鲁棒性

# 增强类型
# TranslationAug: 图像平移增强
network: TranslationAug

# 增强参数配置
network_kwargs:
  # 输入形状
  # null: 自动推断输入图像的形状
  input_shape: null

  # 平移范围（像素）
  # 8: 在 x 和 y 方向上各随机平移 [-8, 8] 像素
  # 较大的值可以增强对大位移的鲁棒性，但可能丢失关键信息
  translation: 8
