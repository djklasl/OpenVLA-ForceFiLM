# ============================================
# 组平移增强配置
# ============================================
# TranslationAugGroup: 对一组图像应用相同的平移变换
# 确保多视角图像（如 agentview 和 eye_in_hand）的平移保持一致

# 增强类型
# TranslationAugGroup: 组级别的平移增强
network: TranslationAugGroup

# 增强参数配置
network_kwargs:
  # 输入形状字典
  # {}: 空字典表示自动处理所有输入的形状
  # 可指定特定输入的形状，如 {"image1": [3, 128, 128], "image2": [3, 64, 64]}
  input_shapes: {}

  # 平移范围（像素）
  # 8: 在 x 和 y 方向上各随机平移 [-8, 8] 像素
  # 所有图像使用相同的平移量，保持视角间的空间对应关系
  translation: 8
