# ============================================
# Identity 语言编码器配置
# ============================================
# IdentityEncoder: 恒等映射编码器（不进行任何变换）
# 用于不需要额外语言编码的场景

# 网络类型
# IdentityEncoder: 直接返回输入，不做任何处理
network: IdentityEncoder

# 网络参数配置
network_kwargs:
    # 哑参数（占位符）
    # true: 启用恒等映射模式
    # 此编码器直接传递输入，不改变特征
    dummy: true
