# ============================================
# MLP 语言编码器配置
# ============================================
# MLPEncoder: 使用多层感知机（MLP）编码语言特征
# 适合处理已经过预训练模型（如 BERT）编码的文本特征

# 网络类型
# MLPEncoder: 简单的全连接网络编码器
network: MLPEncoder

# 网络参数配置
network_kwargs:
    # 输入维度
    # 768: 输入特征的维度
    # 通常对应 BERT-base 的输出维度（768维）
    input_size: 768

    # 隐藏层维度
    # 128: 中间隐藏层的神经元数量
    hidden_size: 128

    # 输出维度
    # 128: 输出语言嵌入的维度
    # 将与图像嵌入等模态特征进行融合
    output_size: 128

    # MLP 层数
    # 1: 使用1个隐藏层
    # 结构: input(768) -> hidden(128) -> output(128)
    num_layers: 1
