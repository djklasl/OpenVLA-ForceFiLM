# ============================================
# RNN 语言编码器配置
# ============================================
# RNNEncoder: 使用循环神经网络（RNN）编码语言特征
# 适合处理需要捕捉语言序列时序信息的场景

# 网络类型
# RNNEncoder: 基于 RNN 的语言编码器
network: RNNEncoder

# 网络参数配置
network_kwargs:
    # 输入维度
    # 768: 输入词向量的维度
    # 通常对应预训练模型（如 BERT）的输出维度
    input_size: 768

    # 隐藏层维度
    # 128: RNN 隐藏状态的维度
    hidden_size: 128

    # 输出维度
    # 16: 输出语言嵌入的维度
    # 较小的维度用于减少计算量
    output_size: 16

    # RNN 层数
    # 1: 使用1层 RNN
    # 增加层数可以增强表达能力，但会增加计算量
    num_layers: 1
