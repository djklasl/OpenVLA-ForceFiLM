# ============================================
# GMM 策略头配置
# ============================================
# GMMHead: Gaussian Mixture Model 策略头
# 使用高斯混合模型输出动作分布，适合处理多模态行为

# 网络类型
# GMMHead: 高斯混合模型输出头
# 将特征映射到多个高斯分布的参数（均值、方差、混合权重）
network: GMMHead

# 网络参数配置
network_kwargs:
    # 隐藏层维度
    # 1024: 输出头全连接层的神经元数量
    hidden_size: 1024

    # MLP 层数
    # 2: 使用2层全连接网络
    num_layers: 2

    # 最小标准差
    # 0.0001: 高斯分布标准差的最小值
    # 防止数值不稳定，确保方差不会为0
    min_std: 0.0001

    # 高斯分量数量（模式数）
    # 5: 使用5个高斯分布的混合
    # 每个分量代表一种可能的动作模式
    # 例如：抓取物体可能从不同角度接近
    num_modes: 5

    # 是否在评估时降低噪声
    # false: 评估时与训练时使用相同的采样策略
    # true: 评估时减少随机性，使输出更确定性
    low_eval_noise: false

    # 激活函数
    # "softplus": 用于确保标准差为正数
    # softplus(x) = log(1 + exp(x))，输出始终为正
    # 其他可选: "exp", "sigmoid", "relu" 等
    activation: "softplus"

# 损失函数参数配置
loss_kwargs:
    # 损失系数
    # 1.0: GMM 损失的权重系数
    # 用于平衡不同损失项的贡献
    loss_coef: 1.0
