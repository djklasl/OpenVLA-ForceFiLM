# @package _global_
# ============================================
# 实验复现配置
# ============================================
# 用于复现论文中的实验结果，覆盖默认配置

# ============================================
# 默认配置覆盖
# ============================================
default:
# 覆盖策略配置为 bc_transformer_policy
# 将使用 Transformer 策略网络进行实验
- override /policy: bc_transformer_policy

# ============================================
# 训练配置覆盖
# ============================================
train:
  # 使用数据增强
  # true: 启用颜色抖动和平移增强
  use_augmentation: true

  # 梯度裁剪阈值
  # 100: 限制梯度范数，防止梯度爆炸
  grad_clip: 100

  # 损失缩放因子
  # 1.0: 不缩放损失
  loss_scale: 1.0

# ============================================
# 评估配置覆盖
# ============================================
eval:
  # 评估频率
  # 5: 每训练5个epoch进行一次评估
  eval_every: 5

  # 训练轮数
  # 50: 总共训练50个epoch
  n_epochs: 50
