# ============================================
# 训练配置文件
# ============================================
# 定义模型训练过程中的超参数和训练流程控制

# ============================================
# 训练基本参数
# ============================================

# 训练轮数
# 50: 遍历整个训练数据集50次
# 更多轮数可能获得更好的性能，但也可能过拟合
n_epochs: 50

# 批次大小
# 32: 每次梯度更新使用32个样本
# 较大的批次训练更稳定但需要更多显存
# 较小的批次噪声更大但可能有更好的泛化
batch_size: 32

# 数据加载工作进程数
# 4: 使用4个子进程并行加载数据
# 可根据CPU核心数调整，通常设置为4-8
num_workers: 4

# 梯度裁剪阈值
# 100.: 将梯度范数限制在100以内
# 防止梯度爆炸，稳定训练过程
# 值为100表示梯度范数超过100时会被缩放
grad_clip: 100.

# 损失缩放因子
# 1.0: 不缩放损失，使用原始损失值
# 可用于平衡多个损失项的权重
loss_scale: 1.0

# ============================================
# 训练恢复配置
# ============================================

# 是否从检查点恢复训练
# false: 从头开始训练
# true: 从指定的检查点继续训练
resume: false

# 检查点路径
# "": 空字符串表示不加载检查点
# 可指定具体路径，如 "checkpoints/epoch_30.ckpt"
resume_path: ""

# 是否启用调试模式
# false: 正常训练模式
# true: 调试模式，可能输出更多日志或减少数据量
debug: false

# ============================================
# 数据增强配置
# ============================================

# 是否使用数据增强
# true: 启用颜色抖动、平移等数据增强
# false: 不使用数据增强
use_augmentation: true

# ============================================
# 优化器和调度器配置
# ============================================
# 通过 Hydra defaults 加载子模块配置
defaults:
    - optimizer@optimizer: adam_w.yaml
    - scheduler@scheduler: cosine_annealing.yaml
