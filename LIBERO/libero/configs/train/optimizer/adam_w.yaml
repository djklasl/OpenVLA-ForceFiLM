# ============================================
# AdamW 优化器配置
# ============================================
# AdamW: Adam 优化器的改进版本，具有解耦的权重衰减
# 相比标准 Adam，能更好地处理 L2 正则化

# 优化器类型
# torch.optim.AdamW: PyTorch 内置的 AdamW 优化器
name: torch.optim.AdamW

# 优化器参数
kwargs:
    # 学习率
    # 0.0001: 控制参数更新步长
    # 较小的学习率训练更稳定但收敛慢，较大的学习率收敛快但不稳定
    lr: 0.0001

    # Beta 系数（动量参数）
    # [0.9, 0.999]:
    # - beta1 (0.9): 梯度的动量系数（一阶矩估计）
    # - beta2 (0.999): 梯度平方的动量系数（二阶矩估计）
    # 这些是 AdamW 的默认值，通常不需要修改
    betas: [0.9, 0.999]

    # 权重衰减（L2 正则化系数）
    # 0.0001: 对权重添加 L2 惩罚，防止过拟合
    # AdamW 将权重衰减与梯度更新解耦，效果更好
    weight_decay: 0.0001
